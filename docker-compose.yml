services:

  app:
    build: .
    container_name: vs-cuidadora-app
    working_dir: /var/www
    volumes:
      - ./src:/var/www

  nginx:
    image: nginx:latest
    container_name: vs-cuidadora-nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: vs-cuidadora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_vs_cuidadora
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
      image: phpmyadmin:latest
      container_name: vs-cuidadora-phpmyadmin
      restart: always
      ports:
        - "8081:80"
      environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
      depends_on:
        - mysql


volumes:
  mysql_data: